<html>
  <head>
    <meta charset="utf-8">
    <title>AWS Account Switcher</title>
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="popup.css">
  </head>
  <body>
    <script src="endpoints.js"></script>
    <script src="popup.js"></script>

    <!-- Header: nav buttons (left) + version (right) -->
    <header>
      <div id="nav">
        <button id="nav_home" class="nav_btn" type="button" title="Accounts" aria-label="Accounts"><i class="fas fa-home"></i></button>
        <button id="nav_settings" class="nav_btn" type="button" title="Settings" aria-label="Settings"><i class="fas fa-cog"></i></button>
      </div>
      <div id="version-info">v5.4.0</div>
    </header>

    <!-- Settings View -->
    <div id="settings_view">
      <span class="setting_name">OKTA Domain</span>
      <input spellcheck="false" class="text_setting_value" id="okta_domain" placeholder="company.okta.com"/>
      <span class="setting_name">AWS Apps <span class="setting_hint">(auto-detected on login)</span></span>
      <div id="aws_apps_list"></div>
      <button id="add_aws_app" type="button" class="secondary_btn">+ Add AWS App</button>
      <label class="toggle_row" for="open_tab_on_switch">
        <input type="checkbox" id="open_tab_on_switch" checked/>
        <span>Open a new AWS tab when switching accounts</span>
      </label>
      <div class="login">
        <button id="okta_login">
          <span>Login</span>
        </button>
      </div>
      <div class="login_status" id="login_status_div">
        <span id="login_status"></span>
      </div>
    </div>

    <!-- Home View: one collapsible tab per configured AWS app (injected by popup.js) -->
    <div id="app_tabs"></div>
  </body>
</html>

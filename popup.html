<html>
  <head>
    <meta charset="utf-8">
    <title>AWS Account Switcher</title>
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="popup.css">
  </head>
  <body>
    <script src="endpoints.js"></script>
    <script src="popup.js"></script>

    <!-- Header: nav buttons (left) + version (right) -->
    <header>
      <div id="nav">
        <button id="nav_home" class="nav_btn" type="button" title="Accounts" aria-label="Accounts"><i class="fas fa-home"></i></button>
        <button id="nav_settings" class="nav_btn" type="button" title="Settings" aria-label="Settings"><i class="fas fa-cog"></i></button>
      </div>
      <div id="version-info"></div>
    </header>

    <!-- Settings View -->
    <div id="settings_view">
      <section class="settings_card">
        <div class="settings_card_title">Okta</div>
        <div class="inline_row">
          <input spellcheck="false" class="text_setting_value" id="okta_domain" placeholder="company.okta.com" aria-label="Okta domain"/>
          <button id="okta_login" type="button"><span>Login</span></button>
        </div>
        <div class="login_status" id="login_status_div">
          <span id="login_status"></span>
        </div>
      </section>

      <section class="settings_card">
        <div class="settings_card_title">AWS apps <span class="setting_hint">auto-detected on login</span></div>
        <div id="aws_apps_list"></div>
        <button id="add_aws_app" type="button" class="secondary_btn"><i class="fas fa-plus"></i> Add AWS app</button>
      </section>

      <section class="settings_card">
        <div class="settings_card_title">Preferences</div>
        <label class="toggle_row" for="open_tab_on_switch">
          <span>Open a new AWS tab when switching</span>
          <input type="checkbox" id="open_tab_on_switch" class="switch" checked/>
        </label>
      </section>
    </div>

    <div id="search_bar">
      <i class="fas fa-search"></i>
      <input id="account_search" type="search" spellcheck="false" autocomplete="off" placeholder="Search account name or id"/>
    </div>
    <div id="app_tabs"></div>
  </body>
</html>
